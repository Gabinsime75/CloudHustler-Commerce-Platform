name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service_name:
        description: "Logical service name."
        required: true
        type: string

      service_path:
        description: "Path to the service source directory."
        required: true
        type: string

      runtime:
        description: "Service runtime: go, node, python, java, dotnet."
        required: true
        type: string

      ecr_repository:
        description: "Amazon ECR repository name."
        required: true
        type: string

      aws_region:
        description: "AWS region."
        required: false
        default: "us-east-2"
        type: string

      role_to_assume:
        description: "AWS IAM role assumed through GitHub OIDC."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # Go
      # ============================================================

      - name: Set up Go
        if: inputs.runtime == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.service_path }}/go.mod
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Download Go dependencies
        if: inputs.runtime == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go mod download

      - name: Run Go tests
        if: inputs.runtime == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go test ./...

      - name: Run Go vet
        if: inputs.runtime == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go vet -copylocks=false ./...

      - name: Install govulncheck
        if: inputs.runtime == 'go'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go vulnerability scan
        if: inputs.runtime == 'go'
        working-directory: ${{ inputs.service_path }}
        continue-on-error: true
        run: govulncheck ./...

      # ============================================================
      # Node.js
      # ============================================================

      - name: Set up Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ inputs.service_path }}/package-lock.json

      - name: Install Node.js dependencies
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.service_path }}
        shell: bash
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_SCRIPT" ]; then
            echo "No npm test script defined - skipping tests."
          elif echo "$TEST_SCRIPT" | grep -qi "no test specified"; then
            echo "Placeholder npm test script detected - skipping tests."
          else
            npm test
          fi

      - name: Run Node.js tests
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.service_path }}
        run: npm test --if-present

      # ============================================================
      # Python
      # ============================================================

      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        if: inputs.runtime == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python tests
        if: inputs.runtime == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          if [ -d tests ]; then python -m pytest; fi

      # ============================================================
      # Java
      # ============================================================

      - name: Set up Java
        if: inputs.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Java tests
        if: inputs.runtime == 'java'
        working-directory: ${{ inputs.service_path }}
        run: |
          chmod +x gradlew
          ./gradlew test

      # ============================================================
      # .NET
      # ============================================================

      - name: Set up .NET
        if: inputs.runtime == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        if: inputs.runtime == 'dotnet'
        working-directory: ${{ inputs.service_path }}
        run: dotnet restore

      - name: Run .NET tests
        if: inputs.runtime == 'dotnet'
        working-directory: ${{ inputs.service_path }}
        run: dotnet test --no-restore

  build-scan-push:
    name: Build Scan Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    needs:
      - validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.image.outputs.tag }} \
            ${{ inputs.service_path }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker image
        shell: bash
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.image.outputs.tag }}

      - name: Print published image
        shell: bash
        run: |
          echo "Published image:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.image.outputs.tag }}"